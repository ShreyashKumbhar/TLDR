name: DevOps intern authenticated AWS plan
on:
  workflow_dispatch:
    inputs:
      container_image:
        description: 'Public linux/amd64 image reference pinned by @sha256 digest'
        required: true
        type: string
      allowed_client_cidr:
        description: 'Your public IPv4 address/32 permitted to reach the ALB'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: devops-intern-aws-plan
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws-plan
    defaults:
      run:
        working-directory: devops-intern-otel-terraform-docker
    env:
      TF_VAR_container_image: ${{ inputs.container_image }}
      TF_VAR_allowed_client_cidr: ${{ inputs.allowed_client_cidr }}
      TF_VAR_sentry_secret_arn: ${{ vars.SENTRY_SECRET_ARN }}
      TF_VAR_offline_plan: 'false'
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.16.2' }
      - name: Verify required configuration and image
        run: |
          test -n "$TF_STATE_BUCKET"
          docker pull --platform linux/amd64 "$TF_VAR_container_image"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize existing encrypted S3 backend
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > terraform/backend.tf
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=devops-intern/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test
      - name: Create authenticated apply-ready plan
        run: |
          terraform -chdir=terraform plan -input=false -out=deployment.tfplan
          terraform -chdir=terraform show -json deployment.tfplan > terraform/plan.json
          terraform -chdir=terraform show -no-color deployment.tfplan > terraform/plan.txt
          npm run test:network
      - uses: actions/upload-artifact@v4
        with:
          name: authenticated-deployment-plan
          retention-days: 3
          path: |
            devops-intern-otel-terraform-docker/terraform/deployment.tfplan
            devops-intern-otel-terraform-docker/terraform/plan.txt
            devops-intern-otel-terraform-docker/terraform/backend.tf
